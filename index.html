<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>map system</title>

  <!-- Подключаем Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

  <style>
    html, body { margin:0; padding:0; height:100%; }

    #map {
      height: 100vh;
      width: 100%;
    }

    /* Верхнее меню выбора карты и даты */
    .top-bar {
      position: fixed;
      top: 10px;
      left: 10px;
      display: flex;
      gap: 8px;
      z-index: 5000;
    }

    .dropdown { position: relative; }

    .drop-btn {
      background: rgba(255,255,255,0.9);
      border: 1px solid #ccc;
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    .menu {
      position: absolute;
      top: 110%;
      left: 0;
      background: white;
      border: 1px solid #ccc;
      border-radius: 6px;
      display: none;
      min-width: 160px;
      z-index: 6000;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }

    .menu button {
      width: 100%;
      padding: 8px;
      border: none;
      background: white;
      cursor: pointer;
      text-align: left;
    }

    .menu button:hover { background: #eee; }

    .dropdown.open .menu { display: block; }

    /* Переключатель темы */
    .control-panel {
      position: fixed;
      top: 10px;
      right: 10px;
      z-index: 5000;
    }

    .control-btn {
      background: rgba(255,255,255,0.9);
      border: 1px solid #ccc;
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
    }

    /* Панель выбора слоев внизу */
    .layers-panel {
      position: fixed;
      bottom: 10px;
      right: 10px;
      background: rgba(255,255,255,0.95);
      padding: 8px;
      border-radius: 6px;
      z-index: 5000;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }

    .layer-btn {
      display: block;
      width: 100%;
      margin: 4px 0;
      padding: 6px 12px;
      border: 1px solid #ccc;
      border-radius: 4px;
      background: white;
      cursor: pointer;
      text-align: left;
    }

    .dark-theme { background:#1e1e1e; }
    .light-theme { background:#fff; }
  </style>
</head>

<body>

<div id="map" class="dark-theme"></div>

<div class="top-bar">
  <!-- Выбор типа карты -->
  <div class="dropdown" id="mapSelect">
    <button class="drop-btn" id="mapBtn">Загрузка...</button>
    <div class="menu" id="mapMenu"></div>
  </div>

  <!-- Выбор даты -->
  <div class="dropdown" id="dateSelect">
    <button class="drop-btn" id="dateBtn">Загрузка...</button>
    <div class="menu" id="dateMenu"></div>
  </div>
</div>

<div class="control-panel">
  <button class="control-btn" id="themeBtn">theme</button>
</div>

<!-- Панель со слоями -->
<div class="layers-panel" id="layers"></div>

<!-- Подключаем Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

/* ==========================================
   КОНФИГУРАЦИЯ РАЗМЕРОВ КАРТ (Ширина, Высота)
========================================== */
const mapConfig = {
  world:   { w: 15000, h: 10000 },
  kiraine: { w: 7500,  h: 4700  },
  america: { w: 12120, h: 12399 },
  altworld:{ w: 15000, h: 10000 }
};

let currentMap = "altworld";
let currentDate = "";
let manifestData = null;
let layerObjects = {};

/* ==========================================
   ПРИОРИТЕТЫ И ПРОЗРАЧНОСТЬ СЛОЕВ
========================================== */
const LAYER_Z_INDEX = {
  'realworld': 1,
  'real_world': 1,
  'fiction': 2,
  'infrastructure': 3,
  'infra': 3,
  'city_names': 4,
  'cities': 4,
  'country_names': 5,
  'countries': 5
};

const LAYER_OPACITY = {
  'realworld': 0.3,
  'real_world': 0.3,
  'city_names': 0.8,
  'cities': 0.8,
  'country_names': 0.8,
  'countries': 0.8
};

// Инициализируем Leaflet в плоских координатах (CRS.Simple)
let map = L.map("map", {
  crs: L.CRS.Simple,
  minZoom: -3,
  maxZoom: 3,
  attributionControl: false
});

function getBounds() {
  const cfg = mapConfig[currentMap] || { w: 15000, h: 10000 };
  return [[0, 0], [cfg.h, cfg.w]];
}

/* ==========================================
   СОЗДАНИЕ ПЛИТОЧНОГО СЛОЯ (ВАШ ПУТЬ)
========================================== */
function createTileLayer(layerName) {
  const bounds = getBounds();
  
  // Прямой путь без лишней папки /0/
  const tileUrl = `images/${currentMap}/${currentDate}/${layerName}/tiles/512/{x}/{y}.webp`;

  return L.tileLayer(tileUrl, {
    tileSize: 512,
    noWrap: true,
    bounds: bounds,
    opacity: LAYER_OPACITY[layerName] || 1.0,
    zIndex: LAYER_Z_INDEX[layerName] || 10
  });
}

function buildMap() {
  // Очищаем старые слои
  Object.values(layerObjects).forEach(l => map.removeLayer(l));
  layerObjects = {};

  const bounds = getBounds();
  map.setMaxBounds(bounds);

  // Известный список слоев (подстройте или расширьте имена под слои из вашeго .pdn)
  const knownLayers = ['realworld', 'real_world', 'fiction', 'infrastructure', 'infra', 'city_names', 'cities', 'country_names', 'countries'];

  knownLayers.forEach(lName => {
    const tileLayer = createTileLayer(lName);
    layerObjects[lName] = tileLayer;
    
    // Включаем слой на карте по умолчанию
    tileLayer.addTo(map);
  });

  map.fitBounds(bounds);
  renderLayersUI();
}

function renderLayersUI() {
  const box = document.getElementById("layers");
  box.innerHTML = "";

  Object.entries(layerObjects).forEach(([name, layer]) => {
    const btn = document.createElement("button");
    btn.className = "layer-btn";
    btn.textContent = name;
    
    if (map.hasLayer(layer)) {
      btn.style.background = "#e0e0e0";
      btn.style.fontWeight = "bold";
    }

    btn.onclick = () => {
      if (map.hasLayer(layer)) {
        map.removeLayer(layer);
        btn.style.background = "white";
        btn.style.fontWeight = "normal";
      } else {
        map.addLayer(layer);
        btn.style.background = "#e0e0e0";
        btn.style.fontWeight = "bold";
      }
    };

    box.appendChild(btn);
  });
}

/* ==========================================
   АВТОМАГИЯ: ЧТЕНИЕ MANIFEST.JSON
========================================== */
fetch('./manifest.json')
  .then(res => res.json())
  .then(data => {
    manifestData = data;
    setupMenus();
  })
  .catch(err => {
    console.error("Файл manifest.json не найден или пуст:", err);
    document.getElementById("mapBtn").textContent = "Нет manifest.json";
  });

function setupMenus() {
  const mapMenu = document.getElementById("mapMenu");
  mapMenu.innerHTML = "";

  const availableMaps = Object.keys(manifestData.maps);
  
  if (availableMaps.length === 0) return;

  availableMaps.forEach(mapName => {
    const btn = document.createElement("button");
    btn.textContent = mapName;
    btn.onclick = () => selectMap(mapName);
    mapMenu.appendChild(btn);
  });

  // Выбираем первую карту из списка
  selectMap(availableMaps[0]);
}

function selectMap(mapName) {
  currentMap = mapName;
  document.getElementById("mapBtn").textContent = mapName;

  const dates = manifestData.maps[mapName].dates;
  const dateMenu = document.getElementById("dateMenu");
  dateMenu.innerHTML = "";

  dates.forEach(d => {
    const btn = document.createElement("button");
    btn.textContent = d;
    btn.onclick = () => selectDate(d);
    dateMenu.appendChild(btn);
  });

  if (dates.length > 0) {
    // Берем последнюю доступную дату
    selectDate(dates[dates.length - 1]);
  }
}

function selectDate(dateStr) {
  currentDate = dateStr;
  document.getElementById("dateBtn").textContent = dateStr;
  buildMap();
}

/* ==========================================
   ВЗАИМОДЕЙСТВИЕ С UI (ДРОПДАУНЫ И ТЕМА)
========================================== */
const mapBtn = document.getElementById("mapBtn");
const mapSelect = document.getElementById("mapSelect");
mapBtn.onclick = () => mapSelect.classList.toggle("open");

const dateBtn = document.getElementById("dateBtn");
const dateSelect = document.getElementById("dateSelect");
dateBtn.onclick = () => dateSelect.classList.toggle("open");

document.getElementById("themeBtn").onclick = () => {
  const m = document.getElementById("map");
  m.classList.toggle("dark-theme");
  m.classList.toggle("light-theme");
};

window.addEventListener("click", e => {
  if (!e.target.closest(".dropdown")) {
    document.querySelectorAll(".dropdown").forEach(d => d.classList.remove("open"));
  }
});

</script>

</body>
</html>
