<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>map system</title>

  <!-- Подключение базовых стилей интерактивной карты Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

  <style>
    /* Растягиваем холст на весь экран без полос прокрутки */
    html, body { margin:0; padding:0; height:100%; width:100%; background: #1a1a1a; }
    #map { height: 100vh; width: 100vw; background: #1a1a1a; }

    /* Верхнее левое меню переключения карт и дат */
    .top-bar {
      position: fixed; top: 10px; left: 10px;
      display: flex; gap: 8px; z-index: 5000;
    }
    .dropdown { position: relative; }
    .drop-btn {
      background: rgba(255,255,255,0.9); border: 1px solid #ccc;
      padding: 6px 10px; border-radius: 6px; cursor: pointer; font-weight: bold;
    }
    .menu {
      position: absolute; top: 110%; left: 0; background: white;
      border: 1px solid #ccc; border-radius: 6px; display: none;
      min-width: 160px; z-index: 6000; box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }
    .menu button {
      width: 100%; padding: 8px; border: none; background: white;
      cursor: pointer; text-align: left;
    }
    .menu button:hover { background: #eee; }
    .dropdown.open .menu { display: block; }

    /* Переключатель темной и светлой темы оформления */
    .control-panel { position: fixed; top: 10px; right: 10px; z-index: 5000; }
    .control-btn {
      background: rgba(255,255,255,0.9); border: 1px solid #ccc;
      padding: 6px 10px; border-radius: 6px; cursor: pointer;
    }

    /* Нижняя правая панель тумблеров слоев */
    .layers-panel {
      position: fixed; bottom: 10px; right: 10px;
      background: rgba(255,255,255,0.95); padding: 8px;
      border-radius: 6px; z-index: 5000; box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }
    .layer-btn {
      display: block; width: 100%; margin: 4px 0; padding: 6px 12px;
      border: 1px solid #ccc; border-radius: 4px; background: white;
      cursor: pointer; text-align: left;
    }

    .dark-theme { background:#1e1e1e; }
    .light-theme { background:#fff; }
  </style>
</head>

<body>

<!-- Контейнер для отображения карты -->
<div id="map" class="dark-theme"></div>

<!-- Выпадающие списки выбора карты и даты -->
<div class="top-bar">
  <div class="dropdown" id="mapSelect">
    <button class="drop-btn" id="mapBtn">Карта</button>
    <div class="menu" id="mapMenu"></div>
  </div>

  <div class="dropdown" id="dateSelect">
    <button class="drop-btn" id="dateBtn">Дата</button>
    <div class="menu" id="dateMenu"></div>
  </div>
</div>

<!-- Кнопка смены темы -->
<div class="control-panel">
  <button class="control-btn" id="themeBtn">theme</button>
</div>

<!-- Панель списка слоев текущей карты -->
<div class="layers-panel" id="layers"></div>

<!-- Подключение движка карт Leaflet -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

// Конфигурация доступных карт, размеров холста, дат и папок слоев
const mapData = {
  kiraine: {
    w: 7500, h: 4700,
    dates: ["2024-05-18"],
    layers: ["realworld", "fiction", "infra", "cities", "countries"]
  },
  altworld: {
    w: 15000, h: 10000,
    dates: ["2026-09-15"],
    layers: ["realworld", "fiction", "infra", "cities", "countries"]
  }
};

// Глобальные переменные текущего состояния системы
let currentMap = "kiraine";
let currentDate = "";
let layerObjects = {};

// Инициализация карты в плоской координатной системе с поддержкой плавного зумирования
let map = L.map("map", {
  crs: L.CRS.Simple,
  minZoom: -5,
  maxZoom: 3,
  zoomSnap: 0, // Плавный зум без фиксированных шагов
  attributionControl: false
});

// Кастомный загрузчик тайлов: инвертирует ось Y и строит точные пути к файлам
L.CustomGridLayer = L.TileLayer.extend({
  createTile: function(coords, done) {
    const tile = document.createElement('img');
    tile.alt = '';

    const layerName = this.options.layerName;
    const cfg = mapData[currentMap] || { w: 7500, h: 4700 };

    // Расчет количества рядов тайлов по высоте для корректного переворота
    const totalRows = Math.ceil(cfg.h / 512);

    // Инверсия Y: превращаем нижние тайлы в верхние согласно файловой системе
    const correctedY = totalRows - 1 - Math.abs(coords.y);
    const cleanX = Math.abs(coords.x);

    // Формирование итогового пути к `.webp` тайлу
    tile.src = `images/${currentMap}/${currentDate}/${layerName}/tiles/512/${cleanX}/${correctedY}.webp`;

    // Обработка событий завершения или ошибки загрузки тайла
    L.DomEvent.on(tile, 'load', L.Util.bind(this._tileOnLoad, this, done, tile));
    L.DomEvent.on(tile, 'error', L.Util.bind(this._tileOnError, this, done, tile));

    return tile;
  }
});

// Создание слоя с принудительной прогрузкой тайлов на любом отдалении
function createTileLayer(layerName) {
  const cfg = mapData[currentMap] || { w: 7500, h: 4700 };
  const bounds = [[0, 0], [cfg.h, cfg.w]];

  return new L.CustomGridLayer('', {
    tileSize: 512,
    noWrap: true,
    bounds: bounds,
    layerName: layerName,

    // ЖЕСТКАЯ ПРИВЯЗКА К ТАЙЛАМ 512:
    minZoom: -5,        // Разрешаем отображение на любом сильном отдалении
    minNativeZoom: 0,   // Брать тайлы из исходной нарезки...
    maxNativeZoom: 0,   // ...и масштабировать их под текущий зум экрана
    
    keepBuffer: 2,       // Подгружать тайлы за краем экрана для плавного скролла
    updateWhenIdle: false // Загружать тайлы моментально на лету
  });
}

// Очистка и полная пересборка всех слоев карты
function buildMap() {
  Object.values(layerObjects).forEach(l => map.removeLayer(l));
  layerObjects = {};

  const cfg = mapData[currentMap] || { w: 7500, h: 4700 };
  const activeLayers = cfg.layers || [];
  const bounds = [[0, 0], [cfg.h, cfg.w]];

  // Подключение всех слоев, принадлежащих текущей карте
  activeLayers.forEach(lName => {
    const tileLayer = createTileLayer(lName);
    layerObjects[lName] = tileLayer;
    tileLayer.addTo(map);
  });

  // Автоматический подгон камеры под границы карты при открытии
  map.fitBounds(bounds);
  renderLayersUI();
}

// Генерация кнопок вкл/выкл слоев на интерфейсе
function renderLayersUI() {
  const box = document.getElementById("layers");
  box.innerHTML = "";

  Object.entries(layerObjects).forEach(([name, layer]) => {
    const btn = document.createElement("button");
    btn.className = "layer-btn";
    btn.textContent = name;
    
    if (map.hasLayer(layer)) {
      btn.style.background = "#e0e0e0";
      btn.style.fontWeight = "bold";
    }

    btn.onclick = () => {
      if (map.hasLayer(layer)) {
        map.removeLayer(layer);
        btn.style.background = "white";
        btn.style.fontWeight = "normal";
      } else {
        map.addLayer(layer);
        btn.style.background = "#e0e0e0";
        btn.style.fontWeight = "bold";
      }
    };

    box.appendChild(btn);
  });
}

// Настройка выпадающего списка карт
function setupMenus() {
  const mapMenu = document.getElementById("mapMenu");
  mapMenu.innerHTML = "";

  Object.keys(mapData).forEach(mapName => {
    const btn = document.createElement("button");
    btn.textContent = mapName;
    btn.onclick = () => selectMap(mapName);
    mapMenu.appendChild(btn);
  });

  selectMap(currentMap);
}

// Выбор конкретной карты
function selectMap(mapName) {
  currentMap = mapName;
  document.getElementById("mapBtn").textContent = mapName;

  const dates = mapData[mapName].dates;
  const dateMenu = document.getElementById("dateMenu");
  dateMenu.innerHTML = "";

  dates.forEach(d => {
    const btn = document.createElement("button");
    btn.textContent = d;
    btn.onclick = () => selectDate(d);
    dateMenu.appendChild(btn);
  });

  if (dates.length > 0) {
    selectDate(dates[dates.length - 1]);
  }
}

// Выбор даты и запуск отрисовки
function selectDate(dateStr) {
  currentDate = dateStr;
  document.getElementById("dateBtn").textContent = dateStr;
  buildMap();
}

// Первоначальный запуск инициализации
setupMenus();

// Обработчики открытия/закрытия выпадающих списков
const mapBtn = document.getElementById("mapBtn");
const mapSelect = document.getElementById("mapSelect");
mapBtn.onclick = () => mapSelect.classList.toggle("open");

const dateBtn = document.getElementById("dateBtn");
const dateSelect = document.getElementById("dateSelect");
dateBtn.onclick = () => dateSelect.classList.toggle("open");

// Обработчик переключения светлой/темной темы
document.getElementById("themeBtn").onclick = () => {
  const m = document.getElementById("map");
  m.classList.toggle("dark-theme");
  m.classList.toggle("light-theme");
};

// Закрытие меню при клике в любую внешнюю область
window.addEventListener("click", e => {
  if (!e.target.closest(".dropdown")) {
    document.querySelectorAll(".dropdown").forEach(d => d.classList.remove("open"));
  }
});

</script>

</body>
</html>
