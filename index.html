<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>map system</title>

  <!-- Стили Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

  <style>
    html, body { margin:0; padding:0; height:100%; width:100%; background: #1a1a1a; }
    #map { height: 100vh; width: 100vw; background: #1a1a1a; }

    /* Верхнее меню выбора карты и даты */
    .top-bar {
      position: fixed; top: 10px; left: 10px;
      display: flex; gap: 8px; z-index: 5000;
    }
    .dropdown { position: relative; }
    .drop-btn {
      background: rgba(255,255,255,0.9); border: 1px solid #ccc;
      padding: 6px 10px; border-radius: 6px; cursor: pointer; font-weight: bold;
    }
    .menu {
      position: absolute; top: 110%; left: 0; background: white;
      border: 1px solid #ccc; border-radius: 6px; display: none;
      min-width: 180px; z-index: 6000; box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      max-height: 300px; overflow-y: auto;
    }
    .menu button {
      width: 100%; padding: 8px; border: none; background: white;
      cursor: pointer; text-align: left;
    }
    .menu button:hover { background: #eee; }
    .dropdown.open .menu { display: block; }

    /* Переключатель темы */
    .control-panel { position: fixed; top: 10px; right: 10px; z-index: 5000; }
    .control-btn {
      background: rgba(255,255,255,0.9); border: 1px solid #ccc;
      padding: 6px 10px; border-radius: 6px; cursor: pointer;
    }

    /* Мобильный контейнер и панель слоев внизу справа */
    .layers-container {
      position: fixed; bottom: 10px; right: 10px;
      display: flex; flex-direction: column; align-items: flex-end;
      z-index: 5000;
    }
    .toggle-layers-btn {
      background: rgba(255,255,255,0.95); border: 1px solid #ccc;
      padding: 8px 12px; border-radius: 6px; cursor: pointer; font-weight: bold;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15); margin-top: 6px;
    }
    .layers-panel {
      background: rgba(255,255,255,0.95); padding: 8px;
      border-radius: 6px; box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      max-height: 350px; overflow-y: auto; min-width: 160px;
    }
    .layers-panel.collapsed { display: none; }
    .layer-btn {
      display: block; width: 100%; margin: 4px 0; padding: 6px 12px;
      border: 1px solid #ccc; border-radius: 4px; background: white;
      cursor: pointer; text-align: left;
    }

    .dark-theme { background:#1e1e1e; }
    .light-theme { background:#fff; }
  </style>
</head>

<body>

<div id="map" class="dark-theme"></div>

<!-- Верхнее меню выбора -->
<div class="top-bar">
  <div class="dropdown" id="mapSelect">
    <button class="drop-btn" id="mapBtn">Карта</button>
    <div class="menu" id="mapMenu"></div>
  </div>

  <div class="dropdown" id="dateSelect">
    <button class="drop-btn" id="dateBtn">Дата</button>
    <div class="menu" id="dateMenu"></div>
  </div>
</div>

<!-- Переключатель темы -->
<div class="control-panel">
  <button class="control-btn" id="themeBtn">theme</button>
</div>

<!-- Мобильная панель управления слоями -->
<div class="layers-container">
  <div class="layers-panel" id="layers"></div>
  <button class="toggle-layers-btn" id="toggleLayersBtn">⚙ Слои</button>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

/* =========================================================================
   1. СТРОГАЯ ИЕРАРХИЯ СЛОЕВ, НАСТРОЙКИ ПРОЗРАЧНОСТИ И КАРТ
========================================================================= */

// Строгий порядок наложения и отображения (сверху вниз)
const LAYER_ORDER = [
  "photo",
  "countriesnames",
  "citiesnames",
  "layer13",
  "strategy",
  "army",
  "googlemaps",
  "infrastructure",
  "background"
];

// Настройки видимости: 0.1 соответствует 90% прозрачности
const LAYER_OPACITY = {
  'googlemaps': 0.35,
  'countriesnames': 0.9,
  'citiesnames': 0.9
};

const mapData = {
  world: {
    w: 15000, h: 10000,
    dates: ["2026-06-04", "2026-09-14"],
    layers: ["googlemaps", "background", "infrastructure", "citiesnames", "countriesnames", "army", "strategy", "layer13", "photo"],
    globalLayers: ["googlemaps", "infrastructure", "layer13", "photo"]
  },
  kiraine: {
    w: 7500, h: 4700,
    dates: ["2024-05-18"],
    layers: ["googlemaps", "background", "infrastructure", "citiesnames", "countriesnames"],
    globalLayers: ["googlemaps"]
  },
  america: {
    w: 12120, h: 12399,
    dates: ["2026-01-01", "2024-12-15"],
    layers: ["googlemaps", "background"],
    globalLayers: ["googlemaps"]
  },
  cuba: {
    w: 0, h: 0,
    dates: ["2026-01-01"],
    layers: ["googlemaps", "background"],
    globalLayers: ["googlemaps"]
  },
  kharkiv: {
    w: 0, h: 0,
    dates: ["2026-01-01"],
    layers: ["googlemaps", "background"],
    globalLayers: ["googlemaps"]
  },
  kiyav: {
    w: 0, h: 0,
    dates: ["2026-01-01"],
    layers: ["googlemaps", "background"],
    globalLayers: ["googlemaps"]
  },
  altworld: {
    w: 15000, h: 10000,
    dates: ["2026-09-15"],
    layers: ["googlemaps", "background", "infrastructure", "citiesnames", "countriesnames"],
    globalLayers: ["googlemaps"]
  }
};

/* =========================================================================
   2. ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ И ИНИЦИАЛИЗАЦИЯ
========================================================================= */
let currentMap = "world";
let currentDate = "";
let layerObjects = {};

function getMapDimensions() {
  const cfg = mapData[currentMap];
  const width = (cfg && cfg.w > 0) ? cfg.w : 15000;
  const height = (cfg && cfg.h > 0) ? cfg.h : 10000;
  return { w: width, h: height };
}

let map = L.map("map", {
  crs: L.CRS.Simple,
  minZoom: -5,
  maxZoom: 3,
  zoomSnap: 0,
  attributionControl: false
});

/* =========================================================================
   3. КАСТОМНЫЙ ЗАГРУЗЧИК С ОПТИМИЗАЦИЕЙ ПАМЯТИ И Z-INDEX
========================================================================= */
L.CustomGridLayer = L.TileLayer.extend({
  createTile: function(coords, done) {
    const tile = document.createElement('img');
    tile.alt = '';

    const layerName = this.options.layerName;
    const mapConfig = mapData[currentMap];
    const dims = getMapDimensions();

    const totalRows = Math.ceil(dims.h / 512);
    const correctedY = totalRows - 1 - Math.abs(coords.y);
    const cleanX = Math.abs(coords.x);

    const isGlobal = mapConfig.globalLayers && mapConfig.globalLayers.includes(layerName);

    if (isGlobal) {
      tile.src = `images/${currentMap}/${layerName}/tiles/512/${cleanX}/${correctedY}.webp`;
    } else {
      tile.src = `images/${currentMap}/${currentDate}/${layerName}/tiles/512/${cleanX}/${correctedY}.webp`;
    }

    L.DomEvent.on(tile, 'load', L.Util.bind(this._tileOnLoad, this, done, tile));
    L.DomEvent.on(tile, 'error', L.Util.bind(this._tileOnError, this, done, tile));

    return tile;
  }
});

function createTileLayer(layerName) {
  const dims = getMapDimensions();
  const bounds = [[0, 0], [dims.h, dims.w]];
  const opacityVal = (LAYER_OPACITY[layerName] !== undefined) ? LAYER_OPACITY[layerName] : 1.0;

  // Рассчитываем zIndex: чем выше слой в LAYER_ORDER, тем выше его zIndex
  const orderIndex = LAYER_ORDER.indexOf(layerName);
  const zIndexVal = orderIndex !== -1 ? (LAYER_ORDER.length - orderIndex) * 10 : 10;

  return new L.CustomGridLayer('', {
    tileSize: 512,
    noWrap: true,
    bounds: bounds,
    layerName: layerName,
    opacity: opacityVal,
    zIndex: zIndexVal,

    minZoom: -5,
    minNativeZoom: 0,
    maxNativeZoom: 0,
    
    // ОПТИМИЗАЦИЯ: Не загружать невидимые тайлы и мгновенно выгружать их
    keepBuffer: 0,
    unloadInvisibleTiles: true,
    updateWhenIdle: false
  });
}

/* =========================================================================
   4. ПОСТРОЕНИЕ КАРТЫ И РЕНДЕР ИНТЕРФЕЙСА СЛОЕВ
========================================================================= */
function buildMap() {
  // Принудительно отключаем и удаляем слои прошлой карты из памяти
  Object.values(layerObjects).forEach(l => {
    if (map.hasLayer(l)) {
      map.removeLayer(l);
    }
  });
  layerObjects = {};

  const dims = getMapDimensions();
  const activeLayers = mapData[currentMap].layers || [];
  const bounds = [[0, 0], [dims.h, dims.w]];

  // Создаем слои
  activeLayers.forEach(lName => {
    const tileLayer = createTileLayer(lName);
    layerObjects[lName] = tileLayer;

    // По умолчанию включен ТОЛЬКО background
    if (lName === "background") {
      tileLayer.addTo(map);
    }
  });

  map.fitBounds(bounds);
  renderLayersUI();
}

function renderLayersUI() {
  const box = document.getElementById("layers");
  box.innerHTML = "";

  // Сортируем отображение кнопок строго по списку LAYER_ORDER
  const sortedNames = Object.keys(layerObjects).sort((a, b) => {
    let idxA = LAYER_ORDER.indexOf(a);
    let idxB = LAYER_ORDER.indexOf(b);
    if (idxA === -1) idxA = 99;
    if (idxB === -1) idxB = 99;
    return idxA - idxB;
  });

  sortedNames.forEach(name => {
    const layer = layerObjects[name];
    const btn = document.createElement("button");
    btn.className = "layer-btn";
    btn.textContent = name;
    
    if (map.hasLayer(layer)) {
      btn.style.background = "#e0e0e0";
      btn.style.fontWeight = "bold";
    }

    btn.onclick = () => {
      if (map.hasLayer(layer)) {
        map.removeLayer(layer);
        btn.style.background = "white";
        btn.style.fontWeight = "normal";
      } else {
        map.addLayer(layer);
        btn.style.background = "#e0e0e0";
        btn.style.fontWeight = "bold";
      }
    };

    box.appendChild(btn);
  });
}

function formatDisplayDate(dateStr) {
  const parts = dateStr.split('-');
  if (parts.length === 5) {
    return `${parts[0]}-${parts[1]}-${parts[2]} (${parts[3]}:${parts[4]})`;
  }
  return dateStr;
}

function setupMenus() {
  const mapMenu = document.getElementById("mapMenu");
  mapMenu.innerHTML = "";

  Object.keys(mapData).forEach(mapName => {
    const btn = document.createElement("button");
    btn.textContent = mapName;
    btn.onclick = () => selectMap(mapName);
    mapMenu.appendChild(btn);
  });

  selectMap(currentMap);
}

function selectMap(mapName) {
  currentMap = mapName;
  document.getElementById("mapBtn").textContent = mapName;

  const dates = mapData[mapName].dates || [];
  const dateMenu = document.getElementById("dateMenu");
  dateMenu.innerHTML = "";

  dates.forEach(d => {
    const btn = document.createElement("button");
    btn.textContent = formatDisplayDate(d);
    btn.onclick = () => selectDate(d);
    dateMenu.appendChild(btn);
  });

  if (dates.length > 0) {
    selectDate(dates[dates.length - 1]);
  }
}

function selectDate(dateStr) {
  currentDate = dateStr;
  document.getElementById("dateBtn").textContent = formatDisplayDate(dateStr);
  buildMap();
}

// Запуск приложения
setupMenus();

/* =========================================================================
   5. ОБРАБОТКА ИНТЕРФЕЙСА И МОБИЛЬНОЙ КНОПКИ
========================================================================= */
const mapBtn = document.getElementById("mapBtn");
const mapSelect = document.getElementById("mapSelect");
mapBtn.onclick = () => mapSelect.classList.toggle("open");

const dateBtn = document.getElementById("dateBtn");
const dateSelect = document.getElementById("dateSelect");
dateBtn.onclick = () => dateSelect.classList.toggle("open");

document.getElementById("themeBtn").onclick = () => {
  const m = document.getElementById("map");
  m.classList.toggle("dark-theme");
  m.classList.toggle("light-theme");
};

// Переключение видимости панели слоев по кнопке
const toggleLayersBtn = document.getElementById("toggleLayersBtn");
const layersPanel = document.getElementById("layers");
toggleLayersBtn.onclick = () => {
  layersPanel.classList.toggle("collapsed");
};

window.addEventListener("click", e => {
  if (!e.target.closest(".dropdown")) {
    document.querySelectorAll(".dropdown").forEach(d => d.classList.remove("open"));
  }
});

</script>

</body>
</html>
