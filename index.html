<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>map system</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

  <style>
    :root {
      --bg: #1a1a1a;
      --panel: rgba(28, 30, 34, 0.88);
      --panel-hover: rgba(58, 62, 70, 0.95);
      --border: rgba(255, 255, 255, 0.14);
      --text: #eceff4;
      --muted: #9aa3b2;
      --accent: #5fb0ff;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; width: 100%; background: var(--bg); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    #map { height: 100vh; height: 100dvh; width: 100vw; background: var(--bg); }

    button { font: inherit; color: var(--text); -webkit-tap-highlight-color: transparent; }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .top-bar {
      position: fixed; z-index: 5000; display: flex; gap: 8px;
      top: calc(10px + env(safe-area-inset-top)); left: calc(10px + env(safe-area-inset-left));
    }
    .control-panel {
      position: fixed; z-index: 5000;
      top: calc(10px + env(safe-area-inset-top)); right: calc(10px + env(safe-area-inset-right));
    }
    .drop-btn, .control-btn, .toggle-layers-btn {
      background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
      padding: 8px 12px; cursor: pointer; font-weight: 600;
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      transition: background .15s;
    }
    .drop-btn:hover, .control-btn:hover, .toggle-layers-btn:hover { background: var(--panel-hover); }
    .control-btn.done { background: #2e7d32; }

    .dropdown { position: relative; }
    .menu {
      position: absolute; top: calc(100% + 6px); left: 0; min-width: 180px; max-height: 60vh; overflow-y: auto;
      background: var(--panel); border: 1px solid var(--border); border-radius: 8px; display: none;
      box-shadow: 0 8px 24px rgba(0,0,0,.4); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    }
    .dropdown.open .menu { display: block; }
    .menu button { display: block; width: 100%; padding: 9px 12px; border: 0; background: none; text-align: left; cursor: pointer; }
    .menu button:hover { background: var(--panel-hover); }
    .menu button.active { color: var(--accent); font-weight: 700; }

    .layers-container {
      position: fixed; z-index: 5000; display: flex; flex-direction: column; align-items: flex-end; gap: 6px;
      bottom: calc(10px + env(safe-area-inset-bottom)); right: calc(10px + env(safe-area-inset-right));
    }
    .layers-panel {
      background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 6px;
      min-width: 190px; max-height: 50vh; overflow-y: auto;
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    }
    .layers-panel.collapsed { display: none; }
    .layer-btn {
      display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 10px;
      border: 0; border-radius: 6px; background: none; cursor: pointer; text-align: left; color: var(--muted);
    }
    .layer-btn:hover { background: var(--panel-hover); }
    .layer-btn::before {
      content: ""; width: 14px; height: 14px; border-radius: 4px; flex: none;
      border: 2px solid var(--muted);
    }
    .layer-btn.on { color: var(--text); font-weight: 600; }
    .layer-btn.on::before { background: var(--accent); border-color: var(--accent); }

    .leaflet-bottom.leaflet-left { margin-bottom: env(safe-area-inset-bottom); margin-left: env(safe-area-inset-left); }

    /* Исправление краша карты на iPhone/iPad */
    .leaflet-container img.leaflet-tile { mix-blend-mode: normal !important; }
  </style>
</head>

<body>

<div id="map"></div>

<div class="top-bar">
  <div class="dropdown" id="mapSelect">
    <button class="drop-btn" id="mapBtn">Карта</button>
    <div class="menu" id="mapMenu"></div>
  </div>
  <div class="dropdown" id="dateSelect">
    <button class="drop-btn" id="dateBtn">Дата</button>
    <div class="menu" id="dateMenu"></div>
  </div>
</div>

<div class="control-panel">
  <button class="control-btn" id="shareBtn">Ссылка</button>
</div>

<div class="layers-container">
  <div class="layers-panel" id="layers"></div>
  <button class="toggle-layers-btn" id="toggleLayersBtn">⚙ Слои</button>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

/* =========================================================================
   1. НАСТРОЙКИ
========================================================================= */
const TILE = 512;
const DEFAULT_MAP = "world";
const DEFAULT_LAYERS = ["background"];   // что включено при первом открытии
const DEFAULT_ZOOM_SWITCH = -1.5;        // <--- ПОРОГ ЗУМА: ниже этого значения грузятся 2048, выше/равно — 512
const IS_MOBILE = L.Browser.mobile;

// Порядок слоёв: первый — самый верхний
const LAYER_ORDER = [
  "photo", "countriesnames", "citiesnames", "layer13", "strategy",
  "army", "googlemaps", "infrastructure", "background"
];

const LAYER_OPACITY = { googlemaps: 0.35, countriesnames: 0.8, citiesnames: 0.8 };

// Красивые названия для меню (необязательно, иначе покажется имя папки)
const LAYER_LABELS = {
  photo: "Фото", countriesnames: "Названия стран", citiesnames: "Названия городов",
  layer13: "Слой 13", strategy: "Стратегия", army: "Армия",
  googlemaps: "Google Maps", infrastructure: "Инфраструктура", background: "Фон"
};

/* Для каждой карты можно задать:
   - has2048: false (если карта маленькая и у неё только папка 512)
   - zoomSwitch: -1.5 (индивидуальный порог переключения 2048 <-> 512, если не указан — берётся DEFAULT_ZOOM_SWITCH) */
const mapData = {
  world: {
    w: 15000, h: 10000,
    zoomSwitch: -1.5,
    dates: ["2026-09-14", "2024-03-26"],
    layers: ["googlemaps", "background", "infrastructure", "citiesnames", "countriesnames", "army", "strategy", "layer13", "photo"],
    globalLayers: ["googlemaps", "infrastructure", "citiesnames", "layer13", "photo"]
  },
  kiraine: {
    w: 7500, h: 4700,
    zoomSwitch: -1.5,
    dates: ["2024-05-18", "2026-09-29"],
    layers: ["googlemaps", "background"],
    globalLayers: ["googlemaps"]
  },
  america: {
    w: 12120, h: 12399,
    zoomSwitch: -1.5,
    dates: ["2024-12-15"],
    layers: ["googlemaps", "background"],
    globalLayers: ["googlemaps"]
  },
  cuba: {
    w: 15000, h: 10000,
    zoomSwitch: -1.5,
    dates: ["2026-01-01"],
    layers: ["googlemaps", "background"],
    globalLayers: ["googlemaps"]
  },
  kharkiv: {
    w: 15000, h: 10000,
    zoomSwitch: -1.5,
    dates: ["2026-01-01"],
    layers: ["googlemaps", "background"],
    globalLayers: ["googlemaps"]
  },
  kiyav: {
    w: 1300, h: 902,
    has2048: false, // только тайлы 512
    dates: ["2025-07-13"],
    layers: ["army", "googlemaps", "background"],
    globalLayers: ["googlemaps"]
  },
  altworld: {
    w: 15000, h: 10000,
    zoomSwitch: -1.5,
    dates: ["2026-09-15"],
    layers: ["googlemaps", "background", "infrastructure", "citiesnames", "countriesnames", "army", "strategy", "layer13", "photo"],
    globalLayers: ["googlemaps", "infrastructure", "citiesnames", "layer13", "photo"]
  }
};

/* =========================================================================
   2. СОСТОЯНИЕ И КАРТА
========================================================================= */
let currentMap = null;
let currentDate = "";
let currentBounds = null;
let layerObjects = {}; // { layerName: { l512: GridLayer, l2048: GridLayer | null } }
let enabledLayers = new Set(DEFAULT_LAYERS);  // запоминается между картами и датами
let pendingView = null;                       // вид из ссылки: [x, y, zoom]

const $ = id => document.getElementById(id);
const getDims = (name = currentMap) => ({ w: mapData[name].w || 15000, h: mapData[name].h || 10000 });
const getDates = name => [...(mapData[name].dates || [])].sort().reverse();   // новые сверху
const mapTitle = name => mapData[name].title || name;
const layerTitle = name => LAYER_LABELS[name] || name;

const map = L.map("map", {
  crs: L.CRS.Simple,
  minZoom: -20,
  maxZoom: 3,
  zoomSnap: 0,
  maxBoundsViscosity: 0.8,
  attributionControl: false,
  zoomControl: false
});
L.control.zoom({ position: "bottomleft" }).addTo(map);

/* Загрузчик тайлов. Параметры карты, даты и размера области (512 или 2048)
   фиксируются при создании слоя. */
const GridLayer = L.TileLayer.extend({
  createTile(coords, done) {
    const tile = document.createElement("img");
    tile.alt = "";
    tile.decoding = "async";

    const { mapName, date, layerName, isGlobal, folderSize, rows, cols } = this.options;
    const x = coords.x;
    const y = coords.y + rows;   // ось Y Leaflet (вверх) -> номер строки файла (сверху вниз)

    if (x < 0 || x >= cols || y < 0 || y >= rows) {
      setTimeout(() => done(null, tile));
      return tile;
    }

    const globalPath = `images/${mapName}/${layerName}/${folderSize}/${x}/${y}.webp`;
    const datePath = `images/${mapName}/${date}/${layerName}/${folderSize}/${x}/${y}.webp`;
    const sources = isGlobal ? [globalPath] : [datePath, globalPath];
    let i = 0;

    tile.onload = () => { tile.onload = tile.onerror = null; done(null, tile); };
    tile.onerror = () => {
      if (i < sources.length) { tile.src = sources[i++]; return; }   // запасной путь
      tile.onload = tile.onerror = null;
      tile.style.visibility = "hidden";                              // без значка «битой картинки»
      done(new Error("tile missing"), tile);
    };
    tile.src = sources[i++];
    return tile;
  }
});

function createSubLayer(layerName, bounds, folderSize) {
  const cfg = mapData[currentMap];
  const { w, h } = getDims();
  const order = LAYER_ORDER.indexOf(layerName);
  // 512px картинка, покрывающая 2048x2048 исходника, имеет нативный зум -2 (2048 / 512 = 4 = 2^2)
  const nativeZoom = folderSize === 2048 ? -2 : 0;

  return new GridLayer("", {
    tileSize: TILE,
    noWrap: true,
    bounds,
    mapName: currentMap,
    date: currentDate,
    layerName,
    folderSize,
    isGlobal: !!(cfg.globalLayers && cfg.globalLayers.includes(layerName)),
    rows: Math.ceil(h / folderSize),
    cols: Math.ceil(w / folderSize),
    opacity: LAYER_OPACITY[layerName] ?? 1,
    zIndex: order !== -1 ? (LAYER_ORDER.length - order) * 10 : 10,
    minZoom: -20,
    minNativeZoom: nativeZoom,
    maxNativeZoom: nativeZoom,
    keepBuffer: IS_MOBILE ? 0 : 2,
    updateWhenIdle: IS_MOBILE,
    updateWhenZooming: false
  });
}

function createLayerPair(layerName, bounds) {
  const cfg = mapData[currentMap];
  const use2048 = cfg.has2048 !== false;
  return {
    l512: createSubLayer(layerName, bounds, 512),
    l2048: use2048 ? createSubLayer(layerName, bounds, 2048) : null
  };
}

/* Переключает активные слои между 2048 и 512 в зависимости от текущего зума */
function syncZoomLayers() {
  if (!currentMap) return;
  const cfg = mapData[currentMap];
  const zoomSwitch = cfg.zoomSwitch ?? DEFAULT_ZOOM_SWITCH;
  const isFarZoom = (cfg.has2048 !== false) && (map.getZoom() < zoomSwitch);

  Object.entries(layerObjects).forEach(([name, pair]) => {
    const isEnabled = enabledLayers.has(name);
    const target = (isFarZoom && pair.l2048) ? pair.l2048 : pair.l512;
    const other = target === pair.l512 ? pair.l2048 : pair.l512;

    if (other && map.hasLayer(other)) map.removeLayer(other);

    if (isEnabled) {
      if (!map.hasLayer(target)) map.addLayer(target);
    } else {
      if (map.hasLayer(target)) map.removeLayer(target);
    }
  });
}

function updateMinZoom() {
  if (!currentBounds) return;
  map.setMinZoom(-20);
  map.setMinZoom(map.getBoundsZoom(currentBounds) - 1);
}

function buildMap(keepView) {
  const prev = keepView ? { c: map.getCenter(), z: map.getZoom() } : null;

  Object.values(layerObjects).forEach(pair => {
    if (pair.l512 && map.hasLayer(pair.l512)) map.removeLayer(pair.l512);
    if (pair.l2048 && map.hasLayer(pair.l2048)) map.removeLayer(pair.l2048);
  });
  layerObjects = {};

  const cfg = mapData[currentMap];
  const { w, h } = getDims();
  currentBounds = L.latLngBounds([[0, 0], [h, w]]);

  map.setMaxZoom(cfg.maxZoom ?? 3);
  map.setMaxBounds(currentBounds.pad(0.25));
  updateMinZoom();

  if (prev) {
    map.setView(prev.c, prev.z, { animate: false });
  } else if (pendingView) {
    map.setView([h - pendingView[1], pendingView[0]], pendingView[2], { animate: false });
  } else {
    map.fitBounds(currentBounds, { animate: false });
  }
  pendingView = null;

  cfg.layers.forEach(name => { layerObjects[name] = createLayerPair(name, currentBounds); });

  const active = cfg.layers.filter(n => enabledLayers.has(n));
  if (!active.length && enabledLayers.size && cfg.layers.includes("background")) {
    enabledLayers.add("background");
  }

  syncZoomLayers();
  renderLayersUI();
}

map.on("zoomend", syncZoomLayers);
map.on("resize", updateMinZoom);

/* =========================================================================
   3. СЛОИ
========================================================================= */
function renderLayersUI() {
  const box = $("layers");
  box.innerHTML = "";
  const rank = n => { const i = LAYER_ORDER.indexOf(n); return i === -1 ? 99 : i; };

  Object.keys(layerObjects).sort((a, b) => rank(a) - rank(b)).forEach(name => {
    const btn = document.createElement("button");
    btn.className = "layer-btn" + (enabledLayers.has(name) ? " on" : "");
    btn.textContent = layerTitle(name);

    btn.onclick = () => {
      const on = !enabledLayers.has(name);
      on ? enabledLayers.add(name) : enabledLayers.delete(name);
      btn.classList.toggle("on", on);
      syncZoomLayers();
      writeHash("replace");
    };
    box.appendChild(btn);
  });
}

/* =========================================================================
   4. ССЫЛКА (карта, дата, слои и положение на карте)
   Формат: #map=world&date=2026-09-14&layers=background,photo&view=x,y,zoom
   x и y — пиксели исходной картинки (от левого верхнего угла)
========================================================================= */
function parseHash() {
  const p = new URLSearchParams(location.hash.slice(1));
  const v = (p.get("view") || "").split(",").map(Number);
  return {
    map: p.get("map"),
    date: p.get("date"),
    layers: p.has("layers") ? p.get("layers").split(",").filter(Boolean) : null,
    view: v.length === 3 && v.every(Number.isFinite) ? v : null
  };
}

function writeHash(mode = "replace") {
  if (!currentMap) return;
  const { h } = getDims();
  const c = map.getCenter();
  const on = Object.keys(layerObjects).filter(n => enabledLayers.has(n));
  const hash = `#map=${currentMap}&date=${currentDate}&layers=${on.join(",")}` +
    `&view=${Math.round(c.lng)},${Math.round(h - c.lat)},${map.getZoom().toFixed(2)}`;
  try {
    history[mode === "push" ? "pushState" : "replaceState"](null, "", hash);
  } catch (e) {
    location.hash = hash;
  }
}

let hashTimer;
map.on("moveend", () => { clearTimeout(hashTimer); hashTimer = setTimeout(writeHash, 300); });

function applyHash() {
  const p = parseHash();
  const name = mapData[p.map] ? p.map : (currentMap || DEFAULT_MAP);
  const dates = getDates(name);
  const date = dates.includes(p.date) ? p.date
    : (name === currentMap && dates.includes(currentDate) ? currentDate : dates[0] || "");
  if (p.layers) enabledLayers = new Set(p.layers);
  pendingView = p.view;
  showMap(name, date, { nav: "replace" });
}

window.addEventListener("hashchange", applyHash);   // кнопки «назад/вперёд» в браузере

/* =========================================================================
   5. МЕНЮ КАРТ И ДАТ
========================================================================= */
function formatDisplayDate(str) {
  if (!str) return "Дата";
  const p = str.split("-");
  return p.length === 5 ? `${p[0]}-${p[1]}-${p[2]} (${p[3]}:${p[4]})` : str;
}

function renderMapMenu() {
  const menu = $("mapMenu");
  menu.innerHTML = "";
  Object.keys(mapData).forEach(name => {
    const btn = document.createElement("button");
    btn.textContent = mapTitle(name);
    btn.classList.toggle("active", name === currentMap);
    btn.onclick = () => {
      if (name === currentMap) return closeMenus();
      const dates = getDates(name);
      // Остаёмся на той же дате, если она есть и на новой карте
      showMap(name, dates.includes(currentDate) ? currentDate : dates[0] || "");
    };
    menu.appendChild(btn);
  });
}

function renderDateMenu() {
  const menu = $("dateMenu");
  menu.innerHTML = "";
  getDates(currentMap).forEach(d => {
    const btn = document.createElement("button");
    btn.textContent = formatDisplayDate(d);
    btn.classList.toggle("active", d === currentDate);
    btn.onclick = () => d === currentDate ? closeMenus() : showMap(currentMap, d, { keepView: true });
    menu.appendChild(btn);
  });
}

function showMap(name, date, { keepView = false, nav = "push" } = {}) {
  const sameMap = name === currentMap;
  currentMap = name;
  currentDate = date;
  $("mapBtn").textContent = mapTitle(name);
  $("dateBtn").textContent = formatDisplayDate(date);
  renderMapMenu();
  renderDateMenu();
  buildMap(keepView && sameMap);
  writeHash(nav);
  closeMenus();
}

function closeMenus(except) {
  document.querySelectorAll(".dropdown").forEach(d => { if (d !== except) d.classList.remove("open"); });
}

[["mapSelect", "mapBtn"], ["dateSelect", "dateBtn"]].forEach(([wrap, btn]) => {
  $(btn).onclick = () => { closeMenus($(wrap)); $(wrap).classList.toggle("open"); };
});

window.addEventListener("click", e => { if (!e.target.closest(".dropdown")) closeMenus(); });
window.addEventListener("keydown", e => { if (e.key === "Escape") closeMenus(); });

/* Панель слоёв: на узких экранах свёрнута */
const layersPanel = $("layers");
if (window.innerWidth < 600) layersPanel.classList.add("collapsed");
$("toggleLayersBtn").onclick = () => layersPanel.classList.toggle("collapsed");

/* =========================================================================
   6. КНОПКА «ССЫЛКА»
========================================================================= */
async function copyText(text) {
  if (navigator.clipboard && window.isSecureContext) {
    await navigator.clipboard.writeText(text);
    return;
  }
  const ta = document.createElement("textarea");   // запасной вариант для http / старых браузеров
  ta.value = text;
  ta.style.cssText = "position:fixed;opacity:0";
  document.body.appendChild(ta);
  ta.select();
  const ok = document.execCommand("copy");
  ta.remove();
  if (!ok) throw new Error("copy failed");
}

$("shareBtn").onclick = async function () {
  const btn = this;
  writeHash("replace");   // ссылка всегда с актуальным положением карты
  try {
    await copyText(location.href);
    btn.textContent = "Скопировано!";
    btn.classList.add("done");
  } catch (err) {
    console.error("Ошибка копирования ссылки:", err);
    btn.textContent = "Не вышло";
  }
  setTimeout(() => { btn.textContent = "Ссылка"; btn.classList.remove("done"); }, 2000);
};

/* =========================================================================
   СТАРТ
========================================================================= */
applyHash();

</script>

</body>
</html>
